[workspace]
members = [
    "demo", "icon-processor",
    "yew-shortcuts",
    "yew-shortcuts-macros",
    "mcp-icon-server",
]
resolver = "3"

[patch.crates-io]
yew = {git = "https://github.com/yewstack/yew.git"}


[workspace.package]
version = "0.1.0"
authors = ["mattsy1999@gmail.com"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Madoshakalaka/yew-shortcuts"
edition = "2024"

[workspace.dependencies]
proc-macro2 = "1.0"
quote = "1.0"
yew = {git = "https://github.com/yewstack/yew.git"}

[workspace.dependencies.syn]
version = "2.0"
features = [
    "full",
    "extra-traits",
]
